<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#F8FAFC" />
  
  <!-- Subtle Drop Shadow for the symbol -->
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B192C" flood-opacity="0.1" />
  </filter>

  <!-- Scaled and Centered Logo Symbol -->
  <g transform="translate(106, 86) scale(3)" filter="url(#shadow)">
    <!-- Location Pin Outer -->
    <path
      d="M50 5 C25 5 5 25 5 50 C5 75 50 115 50 115 C50 115 95 75 95 50 C95 25 75 5 50 5 Z"
      stroke="#2563EB" fill="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
    />
    <!-- Bag Handle -->
    <path
      d="M35 35 C35 20 65 20 65 35"
      stroke="#0B192C" stroke-width="6" stroke-linecap="round" fill="none"
    />
    <!-- Bag Body -->
    <path
      d="M 20 35 H 80 V 70 A 10 10 0 0 1 70 80 H 30 A 10 10 0 0 1 20 70 Z"
      fill="#0B192C"
    />
    <!-- The Geometric 'S' -->
    <path
      d="M 62 48 A 12 12 0 0 0 38 48 C 38 58 62 56 62 66 A 12 12 0 0 1 38 66"
      stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"
    />
    <!-- Speed lines for S -->
    <path
      d="M 32 75 H 22 M 28 69 H 18 M 35 63 H 25"
      stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"
    />
    <!-- Blue Arrow cutting through -->
    <path
      d="M 22 74 L 75 46"
      stroke="#2563EB" stroke-width="5" stroke-linecap="round"
    />
    <path
      d="M 61 45 L 76 45 L 72 58"
      stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"
    />
  </g>
</svg>
